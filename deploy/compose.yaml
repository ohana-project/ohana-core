# Ohana production deployment (ADR-0009, ADR-0018).
#
# Copy env.production.example to .env in this directory, then run:
#
#   docker compose up -d                  # api published directly on $OHANA_PORT
#   docker compose --profile caddy up -d  # Caddy terminates HTTPS in front of api
#
# postgres and rustfs are reachable only on this project's internal network.
# One Ohana image serves everything; migrate, api, and worker differ only in
# their command.
#
# The Ohana image comes from OHANA_IMAGE in .env.
# The Compose file attached to each GitHub release is this file with the
# image pinned to the release version.
# Editing carefully: the release workflow (.github/workflows/release.yml)
# rewrites the `image:` lines that read OHANA_IMAGE and deletes this whole
# paragraph; rewording any of it breaks the release pinning.

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://ohana:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ohana
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://rustfs:9000}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-ohana}
  # The photo upload limit in bytes (issue #17); the default is 25 MiB.
  MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-26214400}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ohana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ohana
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohana -d ohana"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  migrate:
    image: ${OHANA_IMAGE:?Set OHANA_IMAGE in .env}
    command: node src/entrypoints/migrate.ts
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${OHANA_IMAGE:?Set OHANA_IMAGE in .env}
    environment:
      <<: *app-env
      PORT: 3000
      WEB_DIST: /app/web
    ports:
      # With the caddy profile enabled, set OHANA_PORT to 127.0.0.1:3000 in
      # .env so the api is reachable only through Caddy.
      - "${OHANA_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${OHANA_IMAGE:?Set OHANA_IMAGE in .env}
    command: node src/entrypoints/worker.ts
    environment: *app-env
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    profiles: [caddy]
    image: caddy:2.10.2
    environment:
      # Compose defaults it because an empty value would disable the
      # Caddyfile's own fallback.
      CADDY_ADDRESS: ${CADDY_ADDRESS:-localhost}
    ports:
      - "${OHANA_HTTP_PORT:-80}:80"
      - "${OHANA_HTTPS_PORT:-443}:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

configs:
  caddyfile:
    # The $$ renders a literal $ so Compose leaves the Caddy placeholder alone.
    # localhost serves HTTPS with a locally issued certificate; a domain
    # enables automatic Let's Encrypt HTTPS; an http:// prefix serves plain
    # HTTP for installations that terminate TLS elsewhere.
    content: |
      {$$CADDY_ADDRESS:localhost} {
        reverse_proxy api:3000
      }

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
  caddy-config:
