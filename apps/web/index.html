<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest icons for its Home Screen; the touch icon is required. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="rgb(246 241 238)" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="rgb(117 34 49)" />
    <title>Ohana</title>
    <script>
      // Resolves the theme to data-theme on <html> before first paint so
      // the palette never flashes; mirrors src/app/theme.tsx.
      ;(() => {
        var stored = null
        try {
          stored = localStorage.getItem('ohana.theme')
        } catch {}
        var choice =
          stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        var dark =
          choice === 'dark' ||
          (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        // The browser chrome follows the same resolution, not just the
        // system scheme (src/app/theme.tsx repeats it on every change).
        var color = dark ? 'rgb(117 34 49)' : 'rgb(246 241 238)'
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
          meta.removeAttribute('media')
          meta.setAttribute('content', color)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
