<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профиль · Ohana</title>
<link rel="stylesheet" href="../assets/ohana.css">
</head>
<body>

<div id="app" data-shell data-title="Профиль" data-back="home.html">
  <template data-topbar-actions>
    <button type="button" class="btn btn-primary btn-sm d-only" data-edit-profile>Изменить</button>
  </template>

  <main class="content content-narrow" data-od-id="screen-profile" style="padding-top:20px">

    <header class="center" data-od-id="profile-head" style="margin-bottom:22px">
      <span class="avatar avatar-lg" style="--hue:60;width:72px;height:72px;font-size:26px;margin:0 auto 12px">А</span>
      <h1 class="display display-lg">Аня</h1>
      <p class="muted small" style="margin-top:4px">
        <span class="pill" style="margin-right:6px">ВЛАДЕЛЕЦ</span>в «Наша семья» с 12 августа
      </p>
    </header>

    <div class="card list" data-od-id="profile-contacts">
      <div class="list-row" style="min-height:60px">
        <span class="leading"><svg aria-hidden="true"><use href="#i-phone"/></svg></span>
        <span class="body">
          <span class="title num" style="font-size:15.5px">+7 913 456-78-90</span>
          <span class="sub">звонки и мессенджер</span>
        </span>
      </div>
      <div class="list-row" style="min-height:60px">
        <span class="leading"><svg aria-hidden="true"><use href="#i-mail"/></svg></span>
        <span class="body">
          <span class="title">anya@example.ru</span>
          <span class="sub">для писем и ссылок на желания</span>
        </span>
      </div>
      <div class="list-row" style="min-height:60px">
        <span class="leading"><svg aria-hidden="true"><use href="#i-cake"/></svg></span>
        <span class="body">
          <span class="title">14 марта</span>
          <span class="sub">день рождения — появится в календаре семьи</span>
        </span>
      </div>
    </div>

    <p class="field-hint" data-od-id="profile-hint" style="margin:12px 4px 0">
      Контакты видны только семье: Ане, Диме, Люде и Мише. Ohana не просит их при входе.
    </p>

    <div class="stack" style="gap:10px;margin-top:24px">
      <button type="button" class="btn btn-primary btn-lg" data-edit-profile>Изменить контакты</button>
    </div>

    <p class="meta" style="margin:20px 4px 0">ПРОФИЛЬ ХРАНИТСЯ НА ВАШЕМ СЕРВЕРЕ</p>
  </main>
</div>

<script src="../assets/ohana.js"></script>
<script>
  document.addEventListener('click', function (e) {
    if (!e.target.closest('[data-edit-profile]')) return;
    var ov = OHANA_SHEET(
      '<div class="sheet-grab"></div>' +
      '<h2 class="sheet-title">Контакты для семьи</h2>' +
      '<p class="sheet-sub">Их увидят только участники ваших пространств</p>' +
      '<div class="stack" style="gap:14px;margin-bottom:18px">' +
      '<div class="field"><label for="pf-name">Имя</label><input class="input" id="pf-name" value="Аня"></div>' +
      '<div class="field"><label for="pf-phone">Телефон</label><input class="input" id="pf-phone" type="tel" value="+7 913 456-78-90"></div>' +
      '<div class="field"><label for="pf-mail">Email</label><input class="input" id="pf-mail" type="email" value="anya@example.ru"><span class="field-hint">Необязательно — увидят только свои</span></div>' +
      '</div>' +
      '<button type="button" class="btn btn-primary btn-lg" data-profile-save>Сохранить</button>');
    ov.querySelector('[data-profile-save]').addEventListener('click', function () {
      var name = ov.querySelector('#pf-name');
      var f = name.closest('.field');
      if (!name.value.trim()) {
        f.classList.add('invalid', 'shake');
        setTimeout(function () { f.classList.remove('shake'); }, 450);
        return;
      }
      document.querySelector('#profile-head h1').textContent = name.value;
      OHANA_CLOSE(ov);
      OHANA_TOAST('Контакты обновлены');
    });
  });
</script>
</body>
</html>
