# The shared quality gate, called by CI on every branch push and pull
# request, and by the release workflow before anything is published.

name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The media worker's HEIC test decodes through the system libheif
      # CLI, the same decoder the release image ships (issue #17,
      # ADR-0008). The version check fails loudly if the package named no
      # usable decoder instead of failing the tests cryptically later.
      - name: Install HEIC decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples
          heif-dec --version 2>/dev/null || heif-convert --version

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web app
        run: pnpm build

      - name: Check OpenAPI document
        run: pnpm check-openapi

      - name: Check generated API client
        run: pnpm check-api-client

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @ohana/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @ohana/web test:e2e

      # The shell specs need the production build: the service worker and
      # the manifest exist only there (issue #11).
      - name: E2E shell (PWA) tests
        run: pnpm --filter @ohana/web test:e2e:pwa
