name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web app
        run: pnpm build

      - name: Check OpenAPI document
        run: pnpm check-openapi

      - name: Check generated API client
        run: pnpm check-api-client

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build application image
        run: docker build -t ohana:smoke .

      - name: Prepare deployment directory
        run: |
          mkdir deploy/smoke
          cp deploy/compose.yaml deploy/env.production.example deploy/smoke/
          cd deploy/smoke
          cp env.production.example .env
          printf '\nOHANA_IMAGE=ohana:smoke\nPOSTGRES_PASSWORD=smoke-test-password\nSTORAGE_ACCESS_KEY=smoke-key\nSTORAGE_SECRET_KEY=smoke-secret\nOHANA_HTTP_PORT=8080\nOHANA_HTTPS_PORT=8443\n' >> .env

      - name: Smoke test with Caddy enabled
        working-directory: deploy/smoke
        run: |
          docker compose --profile caddy up -d --wait
          docker compose config --format json \
            | jq -e '.services.postgres.ports == null and .services.rustfs.ports == null' > /dev/null
          curl -fsSk --retry 5 --retry-all-errors --retry-delay 1 \
            https://localhost:8443/api/health | grep '"status":"ok"'
          curl -fsSk --retry 5 --retry-all-errors --retry-delay 1 \
            https://localhost:8443/ | grep '<!doctype html'
          curl -fsSk --retry 5 --retry-all-errors --retry-delay 1 \
            https://localhost:8443/some/client/route | grep '<!doctype html'

      - name: Smoke test with Caddy disabled
        working-directory: deploy/smoke
        run: |
          docker compose --profile caddy down
          docker compose up -d --wait
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 \
            http://localhost:3000/api/health | grep '"status":"ok"'
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 \
            http://localhost:3000/ | grep '<!doctype html'

      - name: Failed migration keeps api and worker down
        working-directory: deploy/smoke
        run: |
          docker compose down
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=wrong-password/' .env
          if docker compose up -d --wait; then
            echo '::error::compose up succeeded despite a failing migration'
            exit 1
          fi
          docker compose ps -a --format json \
            | jq -e 'select(.Service == "migrate" and .State == "exited" and .ExitCode == 1)' > /dev/null
          docker compose logs migrate | grep 'Database migration failed'
          test -z "$(docker compose ps -q api)"
          test -z "$(docker compose ps -q worker)"
