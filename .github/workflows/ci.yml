name: CI

# Ordinary pushes run the quality gate and the Compose smoke test and
# publish nothing. Only semantic version tags publish, through the separate
# release workflow.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch and pull request runs are cancelled; runs for main
  # always finish, so every merge keeps its own recorded signal.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Lint the install script
        run: |
          # deploy/install.sh is attached to every release (issue #49);
          # ordinary pushes lint the checkout's copy, the release workflow
          # checks the copy it ships with the version baked in.
          shellcheck -s sh deploy/install.sh
          sh -n deploy/install.sh

      - name: Build application image
        run: docker build -t ohana:smoke .

      - name: Prepare deployment directory
        run: |
          mkdir deploy/smoke
          cp deploy/compose.yaml deploy/env.production.example deploy/smoke/
          cd deploy/smoke
          cp env.production.example .env
          printf '\nOHANA_IMAGE=ohana:smoke\nPOSTGRES_PASSWORD=smoke-test-password\nSTORAGE_ACCESS_KEY=smoke-key\nSTORAGE_SECRET_KEY=smoke-secret\nOHANA_HTTP_PORT=8080\nOHANA_HTTPS_PORT=8443\n' >> .env
          sed -i 's/^OHANA_PORT=3000/OHANA_PORT=127.0.0.1:3000/' .env

      - name: Smoke test with Caddy enabled
        working-directory: deploy/smoke
        run: |
          docker compose --profile caddy up -d --wait
          docker compose config --format json \
            | jq -e '.services.postgres.ports == null and .services.rustfs.ports == null' > /dev/null

      - uses: ./.github/actions/check-serving
        with:
          base-url: https://localhost:8443
          insecure: 'true'

      - name: The api stays behind Caddy
        working-directory: deploy/smoke
        run: |
          if curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):3000/api/health"; then
            echo '::error::the api port is reachable off-loopback while Caddy is enabled'
            exit 1
          fi

      - name: Smoke test with Caddy disabled
        working-directory: deploy/smoke
        run: |
          docker compose --profile caddy down
          sed -i 's/^OHANA_PORT=127.0.0.1:3000/OHANA_PORT=3000/' .env
          docker compose up -d --wait

      - uses: ./.github/actions/check-serving
        with:
          base-url: http://localhost:3000

      - name: Failed migration keeps api and worker down
        working-directory: deploy/smoke
        run: |
          docker compose down
          # Break the next migration by mounting a malformed journal entry and
          # statement into the migrate service.
          mkdir broken
          container=$(docker create ohana:smoke)
          docker cp "$container:/app/src/db/migrations/meta/_journal.json" broken/_journal.json
          docker rm "$container" > /dev/null
          node -e "const fs = require('fs'); const journal = JSON.parse(fs.readFileSync('broken/_journal.json', 'utf8')); journal.entries.push({ idx: journal.entries.length, version: journal.version, when: Date.now(), tag: '0001_broken', breakpoints: true }); fs.writeFileSync('broken/_journal.json', JSON.stringify(journal))"
          printf 'SELECT broken;' > broken/0001_broken.sql
          printf '%s\n' \
            'services:' \
            '  migrate:' \
            '    volumes:' \
            '      - ./broken/_journal.json:/app/src/db/migrations/meta/_journal.json:ro' \
            '      - ./broken/0001_broken.sql:/app/src/db/migrations/0001_broken.sql:ro' \
            > compose.broken.yaml
          compose="docker compose -f compose.yaml -f compose.broken.yaml"
          if $compose up -d --wait; then
            echo '::error::compose up succeeded despite a failing migration'
            exit 1
          fi
          $compose ps -a --format json \
            | jq -e 'select(.Service == "migrate" and .State == "exited" and .ExitCode == 1)' > /dev/null
          $compose logs migrate | grep 'Database migration failed'
          $compose ps -a --format json \
            | jq -e 'select((.Service == "api" or .Service == "worker") and .State == "created")' > /dev/null

      # The installer (issue #49) runs for real here, before any release:
      # a curl shim serves a Compose file pinned to the locally built image
      # (retagged the way a release pins it), so a broken installer fails
      # a pull request instead of the next release's smoke. A CI step has
      # no terminal, so the script takes its default mode without asking.
      - name: Install through the script (the default mode)
        working-directory: deploy
        run: |
          docker tag ohana:smoke ghcr.io/ohana-project/ohana-core:smoke
          mkdir install-shim shim
          sed -e 's|image: ${OHANA_IMAGE:?Set OHANA_IMAGE in .env}|image: ghcr.io/ohana-project/ohana-core:smoke|' \
              -e '/^# The Ohana image comes from OHANA_IMAGE/,/^# paragraph; rewording any of it breaks the release pinning\.$/d' \
            compose.yaml > install-shim/compose.yaml
          grep -q 'image: ghcr.io/ohana-project/ohana-core:smoke' install-shim/compose.yaml
          if grep -q 'OHANA_IMAGE' install-shim/compose.yaml; then
            echo '::error::the shimmed Compose file still references OHANA_IMAGE'
            exit 1
          fi
          cat > shim/curl <<'SHIM'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              *releases/*download/*) arg="file://${GITHUB_WORKSPACE}/deploy/install-shim/compose.yaml" ;;
            esac
            args+=("$arg")
          done
          exec /usr/bin/curl "${args[@]}"
          SHIM
          chmod +x shim/curl
          export PATH="$GITHUB_WORKSPACE/deploy/shim:$PATH"
          mkdir install
          cd install
          sh ../../deploy/install.sh --port 3210

      - uses: ./.github/actions/check-serving
        with:
          base-url: http://localhost:3210

      - name: A second install refuses to overwrite
        working-directory: deploy/install
        run: |
          # The refusal happens before any download, so no shim is needed.
          # Assert the reason, not just the non-zero exit, and that the
          # directory is untouched.
          ls -A > "$RUNNER_TEMP/ls-before-refusal"
          cp .env "$RUNNER_TEMP/env-before-refusal"
          cp compose.yaml "$RUNNER_TEMP/compose-before-refusal"
          if out=$(sh ../../deploy/install.sh --port 3210 2>&1); then
            echo '::error::the installer overwrote an existing installation without --force'
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'refusing to overwrite'
          ls -A > "$RUNNER_TEMP/ls-after-refusal"
          cmp "$RUNNER_TEMP/ls-before-refusal" "$RUNNER_TEMP/ls-after-refusal"
          cmp .env "$RUNNER_TEMP/env-before-refusal"
          cmp compose.yaml "$RUNNER_TEMP/compose-before-refusal"

      - name: A failed download leaves the directory untouched
        working-directory: deploy/install
        run: |
          # A curl shim that fails stands in for a network error: even a
          # --force rewrite must not leave a .env.bak behind on one, so
          # the backup can only exist after the download succeeded.
          ls -A > "$RUNNER_TEMP/ls-before-fail"
          cp .env "$RUNNER_TEMP/env-before-fail"
          mkdir "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexit 22\n' > "$RUNNER_TEMP/shim/curl"
          chmod +x "$RUNNER_TEMP/shim/curl"
          if out=$(PATH="$RUNNER_TEMP/shim:$PATH" sh ../../deploy/install.sh --force --port 3210 2>&1); then
            echo '::error::the installer succeeded despite a failed download'
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'downloading compose.yaml failed'
          ls -A > "$RUNNER_TEMP/ls-after-fail"
          cmp "$RUNNER_TEMP/ls-before-fail" "$RUNNER_TEMP/ls-after-fail"
          cmp .env "$RUNNER_TEMP/env-before-fail"
          cmp compose.yaml "$RUNNER_TEMP/compose-before-refusal"

      - name: --force keeps an installation's secrets
        working-directory: deploy/install
        run: |
          # Assembled the messy way operators do it: an empty assignment
          # first (like the example has), the real value appended after —
          # as an indented export. The last occurrence is what Compose
          # reads, so that is what a --force rewrite must keep — and
          # up --wait below only passes if migrate and the api still
          # authenticate with it.
          real_pw=$(sed -n 's/^[[:space:]]*\(export[[:space:]]\{1,\}\)\{0,1\}POSTGRES_PASSWORD=//p' .env | tr -d '\r' | sed -n '$p')
          real_access=$(grep '^STORAGE_ACCESS_KEY=' .env | tail -n 1 | sed 's/^STORAGE_ACCESS_KEY=//')
          real_secret=$(grep '^STORAGE_SECRET_KEY=' .env | tail -n 1 | sed 's/^STORAGE_SECRET_KEY=//')
          real_admin=$(grep '^ADMIN_INITIAL_PASSWORD=' .env | tail -n 1 | sed 's/^ADMIN_INITIAL_PASSWORD=//')
          sed -i '1i POSTGRES_PASSWORD=' .env
          sed -i "s|^POSTGRES_PASSWORD=${real_pw}|  export POSTGRES_PASSWORD=${real_pw}|" .env
          # A project name in .env must survive the rewrite: the volumes
          # were created under it (here: the same name the directory
          # yields). The quoted, commented form pins the normalisation.
          printf 'COMPOSE_PROJECT_NAME="install" # pinned\n' >> .env
          cp .env "$RUNNER_TEMP/env-before-force"
          export PATH="$GITHUB_WORKSPACE/deploy/shim:$PATH"
          sh ../../deploy/install.sh --force --port 3210
          # A second rewrite must keep the first backup, not clobber it.
          sh ../../deploy/install.sh --force --port 3210
          [ "$(grep -Fx 'COMPOSE_PROJECT_NAME="install" # pinned' .env)" ] ||
            { echo '::error::--force dropped COMPOSE_PROJECT_NAME'; exit 1; }
          env_val=$(sed -n 's/^[[:space:]]*\(export[[:space:]]\{1,\}\)\{0,1\}POSTGRES_PASSWORD=//p' .env | tr -d '\r' | sed -n '$p')
          [ "$env_val" = "$real_pw" ] ||
            { echo '::error::--force regenerated POSTGRES_PASSWORD'; exit 1; }
          [ "$(sed -n 's/^STORAGE_ACCESS_KEY=//p' .env | tail -n 1)" = "$real_access" ] ||
            { echo '::error::--force regenerated STORAGE_ACCESS_KEY'; exit 1; }
          [ "$(sed -n 's/^STORAGE_SECRET_KEY=//p' .env | tail -n 1)" = "$real_secret" ] ||
            { echo '::error::--force regenerated STORAGE_SECRET_KEY'; exit 1; }
          [ "$(sed -n 's/^ADMIN_INITIAL_PASSWORD=//p' .env | tail -n 1)" = "$real_admin" ] ||
            { echo '::error::--force regenerated ADMIN_INITIAL_PASSWORD'; exit 1; }
          [ -f .env.bak ] || { echo '::error::--force left no .env.bak'; exit 1; }
          cmp .env.bak "$RUNNER_TEMP/env-before-force" ||
            { echo '::error::.env.bak is not the previous .env'; exit 1; }
          [ "$(ls .env.bak.* 2> /dev/null | wc -l)" = "1" ] ||
            { echo '::error::the second --force did not leave exactly one timestamped backup'; exit 1; }
          [ "$(stat -c %a .env.bak.*)" = "600" ] ||
            { echo '::error::the timestamped backup is not owner-only'; exit 1; }
          [ "$(stat -c %a .env)" = "600" ] || { echo '::error::.env is not owner-only'; exit 1; }
          [ "$(stat -c %a .env.bak)" = "600" ] || { echo '::error::.env.bak is not owner-only'; exit 1; }

      - uses: ./.github/actions/check-serving
        with:
          base-url: http://localhost:3210

      - name: Reinstalling without the volume's secrets refuses, --force too
        working-directory: deploy/install
        run: |
          # The guard runs before any download and before the overwrite
          # refusal, so no shim is needed. The .env is the only file
          # removed: a realistic operator deletes exactly the file that
          # holds the secrets. The stack of the --force step above is
          # still up, so its data volumes exist.
          mv .env "$RUNNER_TEMP/kept-env"
          ls -A > "$RUNNER_TEMP/ls-before-guard"
          if out=$(sh ../../deploy/install.sh --port 3210 2>&1); then
            echo '::error::reinstalling over a data volume without its secrets succeeded'
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'data volume'
          # --force must not bypass the guard either: without the secrets
          # there is no way past it. A bypass would fall through to the
          # real download; either way the greps below fail this step.
          if out=$(sh ../../deploy/install.sh --force --port 3210 2>&1); then
            echo '::error::--force bypassed the data-volume guard'
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'data volume'
          ls -A > "$RUNNER_TEMP/ls-after-guard"
          cmp "$RUNNER_TEMP/ls-before-guard" "$RUNNER_TEMP/ls-after-guard"
          [ ! -e .env ]
          [ -f compose.yaml ]
          # A project living in another directory must not be erasable
          # from here: the refusal names no erase command.
          mkdir -p "$RUNNER_TEMP/other-install"
          if out=$(cd "$RUNNER_TEMP/other-install" && COMPOSE_PROJECT_NAME=install sh "$GITHUB_WORKSPACE/deploy/install.sh" --port 3210 2>&1); then
            echo '::error::a foreign directory could reinstall over the project'
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'must not be erased from here'
          printf '%s\n' "$out" | grep -q 'down --volumes' && exit 1 || true
          # A .env that kept the database password and only one storage
          # key must hit the media-volume branch: the missing secret key
          # is what the second arm of the guard's condition catches.
          printf 'POSTGRES_PASSWORD=x\nSTORAGE_ACCESS_KEY=x\n' > .env
          out=$(sh ../../deploy/install.sh --port 3210 2>&1) || true
          printf '%s\n' "$out" | grep -q 'rustfs-data'
          rm .env
          # The remedy, executed exactly as the message prints it: it must
          # work without a .env and take the data volumes with it.
          docker compose -p install down --volumes
          [ -z "$(docker volume ls -q --filter label=com.docker.compose.project=install)" ] ||
            { echo '::error::the guard remedy left data volumes behind'; exit 1; }
          mv "$RUNNER_TEMP/kept-env" .env

      - name: Install through the script onto an external proxy network
        working-directory: deploy
        run: |
          cd install
          docker compose down --volumes
          cd ..
          docker network create ci-proxy
          export PATH="$GITHUB_WORKSPACE/deploy/shim:$PATH"
          mkdir install-external
          cd install-external
          COMPOSE_PROJECT_NAME=ohana-ext sh ../../deploy/install.sh --external-network ci-proxy --port 3211
          # A project name from the environment is pinned into .env, so
          # the next plain docker compose call addresses the same project.
          grep -qx 'COMPOSE_PROJECT_NAME=ohana-ext' .env ||
            { echo '::error::the environment project name was not pinned into .env'; exit 1; }

      - uses: ./.github/actions/check-serving
        with:
          base-url: http://127.0.0.1:3211

      - name: A proxy on the shared network reaches the api as ohana
        run: |
          docker run --rm --network ci-proxy busybox:1.37.0 \
            wget -qO- http://ohana:3000/api/health | grep '"status":"ok"'

      - name: Stop the stacks the script installed
        working-directory: deploy
        run: |
          cd install-external
          docker compose down --volumes
          cd ../install
          docker compose down --volumes
