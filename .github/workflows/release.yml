# Publishes a release when the maintainer pushes a semantic version tag such
# as v1.2.0 (ADR-0018): the Ohana image is built natively for linux/amd64 and
# linux/arm64 on GitHub-hosted runners, pushed to GHCR as one
# multi-architecture image, and verified to start from the pulled image on
# both architectures, with Caddy enabled and disabled. Only then does the
# image receive the version tag, and the release carry generated notes plus
# a Compose file pinned to that version and the environment example, so
# operators never build anything and never pull `latest`.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify the tag and prepare the release files
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          # The v*.*.* trigger also matches non-semver names such as v1.x.y;
          # require the real thing (optional -prerelease). Semver +build
          # metadata is rejected because a Docker tag cannot contain '+'.
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::${tag} is not a usable semantic version tag (vMAJOR.MINOR.PATCH with an optional -prerelease; +build metadata is not allowed in image tags)"
            exit 1
          fi
          # GHCR image names must be lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Pin Ohana to the release version; PostgreSQL, RustFS, and Caddy
          # are already pinned to tested versions in deploy/compose.yaml.
          # The paragraph about OHANA_IMAGE only applies to the repository's
          # own file, not to this pinned one, so it goes too.
          mkdir release
          sed -e "s|image: \${OHANA_IMAGE:?Set OHANA_IMAGE in .env}|image: ${image}:${tag}|" \
              -e '/^# The Ohana image comes from OHANA_IMAGE/,/^# paragraph; rewording any of it breaks the release pinning\.$/d' \
            deploy/compose.yaml > release/compose.yaml
          if grep -q 'OHANA_IMAGE' release/compose.yaml; then
            echo '::error::the release Compose file still references OHANA_IMAGE'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*image:.*\$\{' release/compose.yaml; then
            echo '::error::an image in the release Compose file is not pinned'
            exit 1
          fi

          # Release operators never set an image: drop the OHANA_IMAGE block
          # from the attached environment example. cat -s squeezes the gap
          # the deletion leaves.
          sed '/^# Required when you build the image yourself/,/^OHANA_IMAGE=/d' \
            deploy/env.production.example | cat -s > release/env.production.example
          if grep -q 'OHANA_IMAGE' release/env.production.example; then
            echo '::error::the release environment example still references OHANA_IMAGE'
            exit 1
          fi

          # A reworded range end above would delete to the end of the file,
          # so assert the services survived the pinning.
          for service in postgres rustfs migrate api worker caddy; do
            if ! grep -Eq "^  ${service}:" release/compose.yaml; then
              echo "::error::the release Compose file lost the ${service} service (did a sed range terminate?)"
              exit 1
            fi
          done

          # The placeholders only satisfy interpolation; the check is about
          # the file being a valid, fully pinned Compose file.
          POSTGRES_PASSWORD=x STORAGE_ACCESS_KEY=x STORAGE_SECRET_KEY=x \
            docker compose -f release/compose.yaml config --quiet

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 1

  test:
    needs: prepare
    uses: ./.github/workflows/tests.yml

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare platform identifier
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs before the version tag exists: the platform digests are already in
  # GHCR, the multi-architecture image is not tagged yet, so a failed smoke
  # publishes nothing, and a rerun can never move the version tag.
  smoke:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
          - runner: ubuntu-latest
            platform: linux/amd64
            caddy: true
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            caddy: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare platform identifier
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Download this platform's digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: digest

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Pull the platform image by digest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          # Deliberately unauthenticated: this is what an operator's machine
          # does. The first push creates the GHCR package private, so this
          # fails closed until the maintainer makes the package public once
          # (package settings, then Danger Zone, then Change visibility).
          digest="$(basename digest/*)"
          docker pull "${IMAGE}@sha256:${digest}"
          echo "IMAGE_REF=${IMAGE}@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Point the pinned Compose file at the pulled digest
        working-directory: release
        env:
          PINNED: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
        run: |
          # The count comes from the file itself, so adding a fourth Ohana
          # service to deploy/compose.yaml does not need an edit here. The
          # || true keeps the step alive when nothing matches, so the guard
          # below can report why.
          expected=$(grep -c "image: ${PINNED}" compose.yaml || true)
          if [ "$expected" -eq 0 ]; then
            echo '::error::the pinned Ohana image is not in the release Compose file'
            exit 1
          fi
          sed -i "s|image: ${PINNED}|image: ${IMAGE_REF}|g" compose.yaml
          pinned_count=$(grep -c "image: ${IMAGE_REF}" compose.yaml)
          if [ "$pinned_count" -ne "$expected" ]; then
            echo "::error::expected ${expected} services pinned to the pulled digest, found ${pinned_count}"
            exit 1
          fi

      - name: Start the stack
        working-directory: release
        env:
          CADDY: ${{ matrix.caddy == true }}
        run: |
          # Assembled the way the README tells operators to.
          cp env.production.example .env
          printf '\nPOSTGRES_PASSWORD=release-smoke\nSTORAGE_ACCESS_KEY=release-smoke\nSTORAGE_SECRET_KEY=release-smoke\n' >> .env
          if [ "$CADDY" = "true" ]; then
            # With Caddy in front, the api must stay off the host's ports.
            printf 'OHANA_PORT=127.0.0.1:3000\nOHANA_HTTP_PORT=8080\nOHANA_HTTPS_PORT=8443\n' >> .env
            docker compose --profile caddy up -d --wait
          else
            docker compose up -d --wait
          fi

      - uses: ./.github/actions/check-serving
        with:
          base-url: ${{ matrix.caddy == true && 'https://localhost:8443' || 'http://localhost:3000' }}
          insecure: ${{ matrix.caddy == true }}

      - name: With Caddy enabled, the api stays behind it
        if: matrix.caddy == true
        working-directory: release
        run: |
          if curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):3000/api/health"; then
            echo '::error::the api port is reachable off-loopback while Caddy is enabled'
            exit 1
          fi

      - name: Stop the stack
        working-directory: release
        run: docker compose --profile caddy down --volumes

  merge:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-architecture image under the version tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          digest_count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$digest_count" -ne 2 ]; then
            echo '::error::expected two platform digests, found' "$digest_count"
            exit 1
          fi
          # Word splitting is intentional: each digest file name becomes one
          # argument to imagetools create.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            $(printf '%s@sha256:%s ' "${IMAGE}" *)

      - name: Inspect the pushed image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" --generate-notes "${args[@]}" \
            release/compose.yaml release/env.production.example
