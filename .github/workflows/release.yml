# Publishes a release when the maintainer pushes a semantic version tag such
# as v1.2.0 (ADR-0018): the Ohana image is built natively for linux/amd64 and
# linux/arm64 on GitHub-hosted runners, pushed to GHCR as one
# multi-architecture image, and verified to start from the pulled image on
# both architectures, with Caddy enabled, disabled, and through the release's
# own install script in its default (no reverse proxy) and
# external-proxy-network modes. Only then does the image receive the version
# tag, and the release carry generated notes with a Quick start block plus
# three assets: a Compose file pinned to that version, the environment
# example, and the install script with the version baked in — so operators
# never build anything and never pull `latest`.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify the tag and prepare the release files
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          # The v*.*.* trigger also matches non-semver names such as v1.x.y;
          # require the real thing (optional -prerelease). Semver +build
          # metadata is rejected because a Docker tag cannot contain '+'.
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::${tag} is not a usable semantic version tag (vMAJOR.MINOR.PATCH with an optional -prerelease; +build metadata is not allowed in image tags)"
            exit 1
          fi
          # GHCR image names must be lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Pin Ohana to the release version; PostgreSQL, RustFS, and Caddy
          # are already pinned to tested versions in deploy/compose.yaml.
          # The paragraph about OHANA_IMAGE only applies to the repository's
          # own file, not to this pinned one, so it goes too.
          mkdir release
          sed -e "s|image: \${OHANA_IMAGE:?Set OHANA_IMAGE in .env}|image: ${image}:${tag}|" \
              -e '/^# The Ohana image comes from OHANA_IMAGE/,/^# paragraph; rewording any of it breaks the release pinning\.$/d' \
            deploy/compose.yaml > release/compose.yaml
          if grep -q 'OHANA_IMAGE' release/compose.yaml; then
            echo '::error::the release Compose file still references OHANA_IMAGE'
            exit 1
          fi
          if grep -Eq '^[[:space:]]*image:.*\$\{' release/compose.yaml; then
            echo '::error::an image in the release Compose file is not pinned'
            exit 1
          fi

          # Release operators never set an image: drop the OHANA_IMAGE block
          # from the attached environment example. cat -s squeezes the gap
          # the deletion leaves.
          sed '/^# Required when you build the image yourself/,/^OHANA_IMAGE=/d' \
            deploy/env.production.example | cat -s > release/env.production.example
          if grep -q 'OHANA_IMAGE' release/env.production.example; then
            echo '::error::the release environment example still references OHANA_IMAGE'
            exit 1
          fi

          # A reworded range end above would delete to the end of the file,
          # so assert the services survived the pinning.
          for service in postgres rustfs migrate api worker caddy; do
            if ! grep -Eq "^  ${service}:" release/compose.yaml; then
              echo "::error::the release Compose file lost the ${service} service (did a sed range terminate?)"
              exit 1
            fi
          done

          # The installer is shipped with the version and the repository
          # baked in, so the downloaded copy installs exactly its own
          # release's files from the repository it was released by (a fork
          # or a rename must not fetch another repo's Compose file). The
          # rewrite targets the assignment lines only; the checks keep a
          # broken script from ever reaching a release page. shellcheck is
          # preinstalled on the runner.
          sed -e "s|^OHANA_INSTALL_VERSION=.*|OHANA_INSTALL_VERSION='${tag}'|" \
              -e "s|^OHANA_INSTALL_REPO=.*|OHANA_INSTALL_REPO='${GITHUB_REPOSITORY,,}'|" \
            deploy/install.sh > release/install.sh
          if grep -q "^OHANA_INSTALL_VERSION=''" release/install.sh; then
            echo "::error::the release install script does not carry the ${tag} version"
            exit 1
          fi
          if ! grep -qF "OHANA_INSTALL_VERSION='${tag}'" release/install.sh; then
            echo "::error::the release install script does not carry the ${tag} version"
            exit 1
          fi
          if ! grep -qF "OHANA_INSTALL_REPO='${GITHUB_REPOSITORY,,}'" release/install.sh; then
            echo "::error::the release install script does not carry the ${GITHUB_REPOSITORY} repository"
            exit 1
          fi
          shellcheck -s sh release/install.sh
          sh -n release/install.sh

          # The placeholders only satisfy interpolation; the check is about
          # the file being a valid, fully pinned Compose file.
          POSTGRES_PASSWORD=x STORAGE_ACCESS_KEY=x STORAGE_SECRET_KEY=x \
            docker compose -f release/compose.yaml config --quiet

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 1

  test:
    needs: prepare
    uses: ./.github/workflows/tests.yml

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare platform identifier
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs before the version tag exists: the platform digests are already in
  # GHCR, the multi-architecture image is not tagged yet, so a failed smoke
  # publishes nothing, and a rerun can never move the version tag.
  smoke:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
          - runner: ubuntu-latest
            platform: linux/amd64
            caddy: true
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            caddy: true
          # The installer leg (issue #49): the stack comes up through
          # deploy/install.sh itself, the way an operator's one-liner runs
          # it — once in the default mode (no reverse proxy) and once
          # attached to an external proxy network — instead of through
          # hand-assembled files.
          - runner: ubuntu-latest
            platform: linux/amd64
            install_script: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # The installer's own location is /opt/ohana-core; the smoke installs
      # into the directories its steps create instead.
      OHANA_INSTALL_DIR: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare platform identifier
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Download this platform's digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: digest

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Pull the platform image by digest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          # Deliberately unauthenticated: this is what an operator's machine
          # does. The first push creates the GHCR package private, so this
          # fails closed until the maintainer makes the package public once
          # (package settings, then Danger Zone, then Change visibility).
          digest="$(basename digest/*)"
          docker pull "${IMAGE}@sha256:${digest}"
          echo "IMAGE_REF=${IMAGE}@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Point the pinned Compose file at the pulled digest
        working-directory: release
        env:
          PINNED: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
        run: |
          # The count comes from the file itself, so adding a fourth Ohana
          # service to deploy/compose.yaml does not need an edit here. The
          # || true keeps the step alive when nothing matches, so the guard
          # below can report why.
          expected=$(grep -c "image: ${PINNED}" compose.yaml || true)
          if [ "$expected" -eq 0 ]; then
            echo '::error::the pinned Ohana image is not in the release Compose file'
            exit 1
          fi
          sed -i "s|image: ${PINNED}|image: ${IMAGE_REF}|g" compose.yaml
          pinned_count=$(grep -c "image: ${IMAGE_REF}" compose.yaml)
          if [ "$pinned_count" -ne "$expected" ]; then
            echo "::error::expected ${expected} services pinned to the pulled digest, found ${pinned_count}"
            exit 1
          fi

      - name: Start the stack
        if: matrix.install_script != true
        working-directory: release
        env:
          CADDY: ${{ matrix.caddy == true }}
        run: |
          # Assembled the way the README tells operators to.
          cp env.production.example .env
          printf '\nPOSTGRES_PASSWORD=release-smoke\nSTORAGE_ACCESS_KEY=release-smoke\nSTORAGE_SECRET_KEY=release-smoke\n' >> .env
          if [ "$CADDY" = "true" ]; then
            # With Caddy in front, the api must stay off the host's ports.
            printf 'OHANA_PORT=127.0.0.1:3000\nOHANA_HTTP_PORT=8080\nOHANA_HTTPS_PORT=8443\n' >> .env
            docker compose --profile caddy up -d --wait
          else
            docker compose up -d --wait
          fi

      - name: Start the stack with the release install script (the default)
        if: matrix.install_script == true
        working-directory: release
        env:
          RELEASE_DIR: ${{ github.workspace }}/release
        run: |
          # The installer downloads its files from the release assets, which
          # do not exist yet — the release is created only after the smoke
          # passes (ADR-0018). A curl shim in front of PATH serves the
          # digest-pinned compose.yaml locally, so the script's own logic
          # runs end to end against the same images the other legs verified.
          # No flags: this is the default installation, no reverse proxy,
          # and a CI step has no terminal to ask on.
          mkdir shim
          cat > shim/curl <<'SHIM'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              *releases/*download/*) arg="file://${RELEASE_DIR}/compose.yaml" ;;
            esac
            args+=("$arg")
          done
          exec /usr/bin/curl "${args[@]}"
          SHIM
          chmod +x shim/curl
          export PATH="$RELEASE_DIR/shim:$PATH"
          mkdir install
          cd install
          sh ../install.sh

      - uses: ./.github/actions/check-serving
        with:
          base-url: ${{ matrix.caddy == true && 'https://localhost:8443' || 'http://localhost:3000' }}
          insecure: ${{ matrix.caddy == true }}

      # The worker image must decode HEIC on both architectures before the
      # image is published (issue #17, ADR-0008): the decode runs through
      # the shipped `heif-dec` and the worker's own code path.
      - name: Verify HEIC decoding in this image
        working-directory: ${{ matrix.install_script == true && 'release/install' || 'release' }}
        run: |
          docker compose exec -T worker node scripts/verify-heic.ts

      - name: With Caddy enabled, the api stays behind it
        if: matrix.caddy == true
        working-directory: release
        run: |
          if curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):3000/api/health"; then
            echo '::error::the api port is reachable off-loopback while Caddy is enabled'
            exit 1
          fi

      # The external-network mode (issue #49): the api joins an existing
      # Docker network so a reverse proxy in another Compose project can
      # reach it through a generated compose.override.yaml. The network
      # stands in for the operator's proxy project; its serving path is
      # asserted the same way the default mode's is.
      - name: Install through the script onto an external proxy network
        if: matrix.install_script == true
        working-directory: release
        env:
          RELEASE_DIR: ${{ github.workspace }}/release
        run: |
          # The default installation still holds port 3000.
          cd install
          docker compose --profile caddy down --volumes
          cd ..
          docker network create ohana-proxy
          export PATH="$RELEASE_DIR/shim:$PATH"
          mkdir install-external
          cd install-external
          sh ../install.sh --external-network ohana-proxy

      - uses: ./.github/actions/check-serving
        if: matrix.install_script == true
        with:
          base-url: http://127.0.0.1:3000

      - name: On the external proxy network, the api stays off-loopback
        if: matrix.install_script == true
        working-directory: release/install-external
        run: |
          if curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):3000/api/health"; then
            echo '::error::the api port is reachable off-loopback in the external-network mode'
            exit 1
          fi

      - name: The api joins the external proxy network
        if: matrix.install_script == true
        working-directory: release/install-external
        run: |
          # docker inspect reports the name with a leading slash, the
          # network's container list without it.
          api_name=$(docker inspect --format '{{.Name}}' "$(docker compose ps -q api)")
          api_name=${api_name#/}
          if ! docker network inspect ohana-proxy --format '{{range .Containers}}{{.Name}} {{end}}' | grep -qF "${api_name} "; then
            echo '::error::the api container did not join the external network'
            docker network inspect ohana-proxy
            exit 1
          fi

      - name: A client on the network reaches the api as ohana
        if: matrix.install_script == true
        run: |
          # The alias the printed proxy configuration points at must
          # resolve on the shipped stack, on both architectures.
          docker run --rm --network ohana-proxy busybox:1.37.0 \
            wget -qO- http://ohana:3000/api/health | grep '"status":"ok"'

      - name: Stop the stack
        if: matrix.install_script != true
        working-directory: release
        run: docker compose --profile caddy down --volumes

      - name: Stop the stacks the script installed
        if: matrix.install_script == true
        run: |
          cd release/install-external
          docker compose --profile caddy down --volumes
          cd ../install
          docker compose --profile caddy down --volumes

  merge:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-architecture image under the version tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          digest_count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$digest_count" -ne 2 ]; then
            echo '::error::expected two platform digests, found' "$digest_count"
            exit 1
          fi
          sources=()
          for digest_file in *; do
            sources+=("${IMAGE}@sha256:${digest_file}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${sources[@]}"

      - name: Inspect the pushed image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          # The Quick start block (issue #49) carries this release's exact
          # one-liners and is prepended to the generated notes
          # (--notes-file is the body; with --generate-notes GitHub appends
          # the generated part). Piping to sh stays honest: the script is
          # short enough to read first, and the notes say so.
          sed -e "s|@VERSION@|${VERSION}|g" -e "s|@REPO@|${GITHUB_REPOSITORY}|g" > notes.md <<'NOTES'
          ## Quick start

          On a server with [Docker](https://docs.docker.com/engine/install/) and the Compose plugin:

              curl -fsSL https://github.com/@REPO@/releases/download/@VERSION@/install.sh | sudo sh

          Run on a terminal, the script asks whether to enable the bundled Caddy, which serves a domain with automatic Let's Encrypt HTTPS (point the domain's DNS at the machine first). Answer no — or run it without a terminal, or with `| sudo sh -s -- --yes` (pass that in automation that has a terminal attached) — and it serves plain HTTP on port 3000 of the machine itself; no reverse proxy is involved. Signing in sets Secure cookies, so a browser on another machine needs HTTPS: reach Ohana from the machine itself, or use one of the two HTTPS modes. To choose Caddy and its domain without the question:

              curl -fsSL https://github.com/@REPO@/releases/download/@VERSION@/install.sh | sudo sh -s -- --caddy-domain ohana.example.com

          Running your own reverse proxy (an own Caddy, Traefik, nginx — in its own Compose project)? Attach Ohana to its Docker network:

              curl -fsSL https://github.com/@REPO@/releases/download/@VERSION@/install.sh | sudo sh -s -- --external-network <network>

          The script installs into `/opt/ohana-core` wherever it is run from (hence the `sudo`; `OHANA_INSTALL_DIR=<directory>` in its environment picks another place). It downloads this release's `compose.yaml`, generates the secrets into `.env`, and starts the stack; it prints the address and the generated administrator password when done, and in the external-network mode the site to add to your proxy (`reverse_proxy ohana:3000` — the release's `compose.yaml` is never touched, the mode writes a `compose.override.yaml`). It is short — read it before running it (`curl -fsSL https://github.com/@REPO@/releases/download/@VERSION@/install.sh -o install.sh`, then `sh install.sh`), or read `deploy/install.sh` in the repository.
          NOTES

          # --repo keeps gh from looking for a git checkout, which this job
          # does not have.
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --generate-notes --notes-file notes.md "${args[@]}" \
            release/compose.yaml release/env.production.example release/install.sh
